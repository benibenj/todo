<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<title>Todo</title>
	<link rel="stylesheet" href="styles.css" />
</head>
<body>
	<main class="app">
		<header class="header">
			<h1>Todo</h1>
			<button id="themeToggle" class="theme-toggle" aria-label="Toggle theme">
				<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"></path></svg>
			</button>
		</header>

		<form id="todoForm" class="todo-form">
			<input
				id="todoInput"
				type="text"
				placeholder="What needs to be done?"
				autocomplete="off"
				maxlength="200"
				required
			/>
			<button type="submit" aria-label="Add todo">
				<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
			</button>
		</form>

		<section class="filters" id="filters">
			<button class="filter-btn active" data-filter="all">All</button>
			<button class="filter-btn" data-filter="active">Active</button>
			<button class="filter-btn" data-filter="completed">Completed</button>
		</section>

		<ul id="todoList" class="todo-list"></ul>

		<footer class="footer" id="footer" hidden>
			<span id="count">0 items left</span>
			<button id="clearCompleted" class="link-btn">Clear completed</button>
		</footer>

		<p id="empty" class="empty">Nothing to do. Add your first task above.</p>
	</main>

	<script src="app.js"></script>
</body>
</html>
